[pytest]
testpaths = tests
# Integration tests start Gazebo and take ~1 min; run them with `pytest -m integration`.
# launch_testing (ROS 2 Humble) auto-registers pytest plugins (`launch_testing`, and
# `launch_ros` from launch_testing_ros) that break collection on pytest 8
# (import_path() signature change); we do not use them.
addopts = -m "not integration" -p no:launch_testing -p no:launch_ros
markers =
    integration: needs the conda env with ROS 2 + Gazebo; starts real processes (deselected by default)
